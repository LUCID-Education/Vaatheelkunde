<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oefenvragen — Occlusief lijden – Chronische ischemie onderste ledematen (Les 2)</title>
<style>
  :root{
    /* papier */
    --paper:#FFFFFF;
    --tint:#FBF6F5;
    --tint-2:#F5EBEA;
    --line:#E7DAD9;
    --line-soft:#EFE5E4;
    --text:#241A1E;
    --muted:#786169;
    /* bloed: chrome, voortgang, vignet */
    --blood:#8C1D33;
    --blood-dark:#6E1327;
    --blood-soft:#F7E9EB;
    /* geoxygeneerd: juist antwoord */
    --ok:#1C7A5B;
    --ok-soft:#E9F4EF;
    /* fout antwoord */
    --wrong:#C62B3E;
    --wrong-soft:#FDECEE;
    --r:12px;
    --pad:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 56px}

  /* ---------- top bar ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 10px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:22px;
  }
  .back{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--muted);text-decoration:none;
    font-size:14px;font-weight:500;
    padding:10px 12px 10px 0;
    border-radius:var(--r);
    transition:color .15s ease;
  }
  .back:hover{color:var(--blood)}
  .brand{font-size:12px;color:#A08A90}

  /* ---------- vat als voortgangsindicator ---------- */
  .vessel{display:flex;gap:2px;height:9px;margin:0 0 8px}
  .seg{
    flex:1;background:var(--tint-2);
    transition:background .35s ease;
  }
  .seg:first-child{border-radius:6px 0 0 6px}
  .seg:last-child{border-radius:0 6px 6px 0}
  .seg.done{background:var(--blood-dark)}
  .seg.now{background:var(--blood)}
  .count{font-size:13px;color:var(--muted);margin:0 0 20px}

  /* ---------- typografie ---------- */
  h1{font-size:27px;line-height:1.2;letter-spacing:-.02em;font-weight:650;margin:0 0 6px}
  h1:focus,h2:focus{outline:none}
  .lede{color:var(--muted);margin:0 0 26px;font-size:15.5px}
  .vignette{
    font-family:Georgia,"Times New Roman",serif;
    font-size:16.5px;line-height:1.62;color:#4A3840;
    margin:0 0 14px;padding-left:14px;
    border-left:2px solid var(--blood);
  }
  .stem{font-size:19px;line-height:1.38;font-weight:600;margin:0 0 18px;letter-spacing:-.01em}

  /* ---------- recap ---------- */
  .recap{list-style:none;margin:0 0 28px;padding:0}
  .recap li{
    padding:12px 0 12px 15px;
    border-left:2px solid var(--line);
    font-size:15px;color:#4A3840;
  }
  .recap li + li{margin-top:2px}
  .recap b{color:var(--text);font-weight:600}

  /* ---------- antwoordopties ---------- */
  .opts{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    width:100%;min-height:52px;padding:13px 14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--r);
    color:var(--text);
    font:inherit;font-size:15.5px;line-height:1.4;
    text-align:left;cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  .opt:hover:not(:disabled){border-color:#C9A9AF;background:var(--tint)}
  .opt:disabled{cursor:default}
  .key{
    flex:0 0 22px;height:22px;margin-top:1px;
    display:grid;place-items:center;
    border:1px solid var(--line);border-radius:6px;
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    transition:border-color .15s ease,color .15s ease,background .15s ease;
  }
  .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
  .opt.ok .key{border-color:var(--ok);color:#FFFFFF;background:var(--ok);font-size:13px}
  .opt.bad{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.bad .key{border-color:var(--wrong);color:#FFFFFF;background:var(--wrong);font-size:13px}
  .opt.dim{opacity:.66}
  .why{margin:9px 0 0;padding:0;font-size:14px;line-height:1.5;color:var(--muted)}
  .opt.ok .why{color:#16624A}
  .opt.bad .why{color:#98202F}
  .col{display:flex;flex-direction:column;min-width:0}

  /* ---------- verdict en knoppen ---------- */
  .verdict{font-size:14.5px;font-weight:600;margin:0 0 14px}
  .verdict.good{color:var(--ok)}
  .verdict.poor{color:var(--wrong)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:100%;min-height:52px;padding:14px 20px;
    border-radius:var(--r);border:1px solid transparent;
    font:inherit;font-size:16px;font-weight:600;
    cursor:pointer;text-decoration:none;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-primary{background:var(--blood);color:#FFF8F9;border-color:var(--blood)}
  .btn-primary:hover{background:var(--blood-dark);border-color:var(--blood-dark)}
  .btn-ghost{background:var(--paper);color:var(--text);border-color:var(--line)}
  .btn-ghost:hover{border-color:#C9A9AF;background:var(--tint)}
  .btn + .btn{margin-top:10px}
  .hint{font-size:12.5px;color:#A08A90;margin:14px 0 0;text-align:center}

  /* ---------- eindscherm ---------- */
  .score{display:flex;align-items:baseline;gap:12px;padding:20px 0 4px}
  .score b{font-size:44px;font-weight:650;letter-spacing:-.03em;line-height:1;color:var(--blood)}
  .score span{font-size:15px;color:var(--muted)}
  .msg{color:#4A3840;margin:8px 0 26px;font-size:15.5px}
  .review{margin:0 0 24px}
  .review h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 12px}
  .miss{
    background:var(--tint);border:1px solid var(--line);
    border-radius:var(--r);padding:14px;margin-bottom:10px;
  }
  .miss p{margin:0 0 6px;font-size:15px;line-height:1.4;font-weight:600}
  .miss .fix{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.5}
  .miss .fix em{color:#16624A;font-style:normal}
  .jump{
    display:inline-flex;align-items:center;gap:8px;
    min-height:44px;padding:10px 14px;
    background:var(--paper);
    border:1px solid var(--line);border-radius:10px;
    color:var(--text);text-decoration:none;font-size:14px;font-weight:500;
    transition:border-color .15s ease,background .15s ease;
  }
  .jump:hover{border-color:var(--blood);background:var(--blood-soft)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--blood);flex:0 0 auto}

  :focus-visible{outline:2px solid var(--blood-dark);outline-offset:2px;border-radius:4px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  @media (min-width:600px){:root{--pad:24px} h1{font-size:31px}}
</style>
</head>

      stem: "Welke beeldvorming is hier het meest aangewezen?",
      options: [

    {

      vignette: "Yan heeft claudicatio na 200 meter en een enkel-armindex van 0,62. Hij heeft geen rustpijn en geen wonden. Hij rookt nog steeds.",

      options: [
        { text: "Een conservatieve aanpak: rookstop met professionele begeleiding, gesuperviseerde looptraining en het aanpakken van zijn overige risicofactoren.",

          correct: false,
          why: "Bij claudicatio grijp je niet standaard in: je weegt winst tegen risico af per patiënt en per letsel. Alleen bij kritische lidmaatischemie behandel je altijd invasief." },
        { text: "Enkel antitrombotica opstarten; het bloedingsrisico hoef je daarbij niet apart in te schatten.",
          correct: false,
          why: "Twee fouten: medicatie vervangt rookstop en looptraining niet, en bij het opstarten van antitrombotica schat je het bloedingsrisico wel degelijk in, bijvoorbeeld met de OAC³PAD-score." },
        { text: "Afwachten zonder maatregelen, want zijn klachten zijn stabiel en de kans op amputatie is klein.",
          correct: false,
          why: "Het lokale risico is inderdaad beperkt, maar dat is niet waarom je behandelt: zonder rookstop en looptraining blijft zijn cardiovasculaire risico onaangeroerd en kan de loopafstand verder dalen." }

/* =========================================================================
   RENDERLOGICA — hieronder staat geen inhoud meer.
   ========================================================================= */

(function () {
  "use strict";

  var app = document.getElementById("app");
  var backLink = document.getElementById("backLink");
  backLink.href = QUIZ.videoUrl;

  var state = { order: [], optOrder: [], current: 0, answers: [], started: false };
  var LETTERS = "ABCDEFGH";

  function label(i) { return LETTERS.charAt(i) || String(i + 1); }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* accepteert 275, "4:35" of "1:04:35" */
  function toSeconds(t) {
    if (typeof t === "number") return Math.max(0, Math.round(t));
    var parts = String(t).trim().split(":").map(function (p) { return parseInt(p, 10) || 0; });
    var s = 0;
    for (var i = 0; i < parts.length; i++) s = s * 60 + parts[i];
    return Math.max(0, s);
  }
  function videoAt(t) {
    var sep = QUIZ.videoUrl.indexOf("?") === -1 ? "?" : "&";
    return QUIZ.videoUrl + sep + "t=" + toSeconds(t);
  }
  function focusFirst() {
    var h = app.querySelector("[data-focus]");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    window.scrollTo(0, 0);
  }

  /* ---------- startscherm ---------- */
  function renderStart() {
    var items = QUIZ.recap.map(function (r) { return "<li>" + r + "</li>"; }).join("");
    app.innerHTML =
      '<h1 data-focus>' + esc(QUIZ.title) + '</h1>' +
      '<p class="lede">' + esc(QUIZ.lede) + '</p>' +
      '<ul class="recap">' + items + '</ul>' +
      '<button class="btn btn-primary" id="start">Start de ' + QUIZ.questions.length + ' vragen</button>' +
      '<p class="hint">Toets A tot D om te antwoorden, Enter voor de volgende vraag.</p>';
    document.getElementById("start").addEventListener("click", function () { begin(false); });
    focusFirst();
  }

  /* vragen in vaste volgorde bij de eerste beurt, willekeurig bij een nieuwe
     poging; de opties worden altijd gehusseld */
  function begin(randomiseQuestions) {
    var n = QUIZ.questions.length;
    state.order = randomiseQuestions ? shuffle(range(n)) : range(n);
    state.optOrder = state.order.map(function (qi) {
      return shuffle(range(QUIZ.questions[qi].options.length));
    });
    state.answers = new Array(n).fill(null);
    state.current = 0;
    state.started = true;
    renderQuestion();
  }

  /* ---------- vraagscherm ---------- */
  function renderQuestion() {
    var pos = state.current;
    var q = QUIZ.questions[state.order[pos]];
    var oo = state.optOrder[pos];
    var total = state.order.length;

    var segs = "";
    for (var s = 0; s < total; s++) {
      var cls = s < pos ? "seg done" : (s === pos ? "seg now" : "seg");
      segs += '<div class="' + cls + '"></div>';
    }

    var opts = oo.map(function (oi, idx) {
      var o = q.options[oi];
      return '<button class="opt" data-idx="' + idx + '" data-opt="' + oi + '">' +
               '<span class="key">' + label(idx) + '</span>' +
               '<span class="col"><span>' + esc(o.text) + '</span>' +
               '<span class="why" hidden></span></span>' +
             '</button>';
    }).join("");

    app.innerHTML =
      '<div class="vessel" role="presentation">' + segs + '</div>' +
      '<p class="count">Vraag ' + (pos + 1) + ' van ' + total + '</p>' +
      (q.vignette ? '<p class="vignette">' + esc(q.vignette) + '</p>' : '') +
      '<h2 class="stem" data-focus>' + esc(q.stem) + '</h2>' +
      '<div class="opts" id="opts">' + opts + '</div>' +
      '<p class="verdict" id="verdict" aria-live="polite"></p>' +
      '<div id="actions"></div>';

    Array.prototype.slice.call(app.querySelectorAll(".opt")).forEach(function (b) {
      b.addEventListener("click", function () { answer(parseInt(b.dataset.opt, 10)); });
    });
    focusFirst();
  }

  function answer(chosenOpt) {
    var pos = state.current;
    if (state.answers[pos] !== null) return;
    state.answers[pos] = chosenOpt;

    var q = QUIZ.questions[state.order[pos]];
    var isRight = q.options[chosenOpt].correct === true;
    var buttons = Array.prototype.slice.call(app.querySelectorAll(".opt"));
    var correctIdx = 0;

    buttons.forEach(function (b, i) {
      var oi = parseInt(b.dataset.opt, 10);
      var o = q.options[oi];
      b.disabled = true;
      if (o.correct) { b.classList.add("ok"); correctIdx = i; }
      else if (oi === chosenOpt) b.classList.add("bad");
      else b.classList.add("dim");
      var key = b.querySelector(".key");
      if (o.correct) key.textContent = "\u2713";
      else if (oi === chosenOpt) key.textContent = "\u2715";
      var why = b.querySelector(".why");
      why.textContent = o.why;
      why.hidden = false;
    });

    var v = document.getElementById("verdict");
    v.className = "verdict " + (isRight ? "good" : "poor");
    v.textContent = isRight ? "Juist." : "Fout — het juiste antwoord is optie " + label(correctIdx) + ".";

    var last = pos === state.order.length - 1;
    document.getElementById("actions").innerHTML =
      '<button class="btn btn-primary" id="next">' + (last ? "Bekijk je resultaat" : "Volgende vraag") + '</button>';
    var next = document.getElementById("next");
    next.addEventListener("click", advance);
    next.focus({ preventScroll: true });
  }

  function advance() {
    if (state.current === state.order.length - 1) renderResults();
    else { state.current++; renderQuestion(); }
  }

  /* ---------- eindscherm ---------- */
  function renderResults() {
    state.started = false;
    var total = state.order.length;
    var wrong = [];
    var score = 0;

    state.order.forEach(function (qi, pos) {
      var q = QUIZ.questions[qi];
      var chosen = state.answers[pos];
      if (chosen !== null && q.options[chosen].correct) score++;
      else wrong.push(q);
    });

    var pct = Math.round((score / total) * 100);
    var msg = pct === 100 ? "Alles juist. Deze les zit."
            : pct >= 75 ? "Stevige basis. Neem de misgelopen stukjes nog eens door."
            : pct >= 50 ? "De helft zit er. De fragmenten hieronder zijn je snelste winst."
            : "Nog wat werk. Bekijk de aangeduide stukken opnieuw en probeer daarna nog eens.";

    var reviewHtml = "";
    if (wrong.length) {
      reviewHtml = '<div class="review"><h2>Wat nog niet zat</h2>' +
        wrong.map(function (q) {
          var right = q.options.filter(function (o) { return o.correct; })[0];
          return '<div class="miss">' +
                   '<p>' + esc(q.stem) + '</p>' +
                   '<p class="fix"><em>' + esc(right.text) + '</em></p>' +
                   '<a class="jump" href="' + videoAt(q.t) + '" target="_blank" rel="noopener">' +
                     '<span class="dot"></span>Bekijk dit stuk opnieuw</a>' +
                 '</div>';
        }).join("") + '</div>';
    }

    app.innerHTML =
      '<h1 data-focus>Resultaat</h1>' +
      '<div class="score"><b>' + score + '/' + total + '</b><span>' + pct + '% juist</span></div>' +
      '<p class="msg">' + esc(msg) + '</p>' +
      reviewHtml +
      '<button class="btn btn-primary" id="again">Opnieuw proberen</button>' +
      '<a class="btn btn-ghost" href="' + QUIZ.videoUrl + '" target="_blank" rel="noopener">Terug naar de video</a>';

    document.getElementById("again").addEventListener("click", function () { begin(true); });
    focusFirst();
  }

  /* ---------- toetsenbord ---------- */
  document.addEventListener("keydown", function (e) {
    if (!state.started) return;
    if (e.target && (e.target.tagName === "A" || e.target.id === "next")) return;
    var pos = state.current;
    var answered = state.answers[pos] !== null;

    if (!answered) {
      var idx = -1;
      if (e.key >= "1" && e.key <= "9") idx = parseInt(e.key, 10) - 1;
      else if (e.key.length === 1) idx = LETTERS.indexOf(e.key.toUpperCase());
      if (idx >= 0) {
        var b = app.querySelector('.opt[data-idx="' + idx + '"]');
        if (b) { e.preventDefault(); answer(parseInt(b.dataset.opt, 10)); return; }
      }
    }
    if (e.key === "Enter" && answered) { e.preventDefault(); advance(); }
  });

  renderStart();
})();
</script>
</body>
</html>
